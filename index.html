<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link rel="icon" href="./favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Shared Budget</title>
    <script type="module" crossorigin src="/BudgetApp/assets/index-afqWbIoR.js"></script>
    <link rel="stylesheet" crossorigin href="/BudgetApp/assets/index-CoEt1ETR.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        const fieldSelector = 'input[type="number"], input[type="text"], input:not([type])';
        const inputs = document.querySelectorAll(fieldSelector);

        inputs.forEach((input) => {
          input.type = 'text';
          input.setAttribute('inputmode', 'decimal');
          input.setAttribute('pattern', '[0-9]*');
          input.setAttribute('autocomplete', 'off');
          input.setAttribute('autocorrect', 'off');
          input.setAttribute('autocapitalize', 'none');
        });
      })();
    </script>
  </body>
</html>
