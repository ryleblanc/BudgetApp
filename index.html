<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link rel="icon" href="./favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Shared Budget</title>
    <script type="module" crossorigin src="/BudgetApp/assets/index-afqWbIoR.js"></script>
    <link rel="stylesheet" crossorigin href="/BudgetApp/assets/index-CoEt1ETR.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        function looksLikeNumericField(input) {
          if (!input) return false;
          const name = (input.name || input.id || input.placeholder || '').toLowerCase();
          return input.type === 'number' ||
            (input.type === 'text' && /(amount|budget|expense|income|balance|value|cost|total|payment|debt|credit|loan|price)/i.test(name));
        }

        function sanitizeNumericString(value) {
          if (value == null) return '';

          let next = String(value).trim();
          if (next === '') return '';

          if (next === '-') return '-';

          let isNegative = false;
          if (next.startsWith('-')) {
            isNegative = true;
            next = next.slice(1);
          }

          next = next.replace(/[^0-9.]/g, '');

          if (next === '') return isNegative ? '-' : '';

          const parts = next.split('.');
          const whole = parts.shift() || '';
          const fraction = parts.join('');
          let normalized = whole || '0';

          if (fraction) {
            normalized += '.' + fraction.replace(/\./g, '');
          }

          if (normalized === '0' && next.startsWith('.')) {
            normalized = '0' + normalized;
          }

          return (isNegative ? '-' : '') + normalized;
        }

        function isValidNumericValue(value) {
          if (value === '' || value === '-') return true;
          return /^-?(?:\d+|\d+\.\d+|\.\d+)$/.test(value);
        }

        function applyNumericValidation(input) {
          if (!input) return;

          const original = input.value;
          const sanitized = sanitizeNumericString(original);
          if (sanitized !== original) {
            input.value = sanitized;
          }

          if (!isValidNumericValue(input.value)) {
            input.setCustomValidity('Use a valid number with an optional leading minus sign and decimal point.');
            return false;
          }

          input.setCustomValidity('');
          return true;
        }

        function bindNumericField(input) {
          if (!input || input.dataset.numericValidated === 'true') return;
          input.dataset.numericValidated = 'true';

          input.type = 'text';
          input.setAttribute('inputmode', 'decimal');
          input.setAttribute('autocomplete', 'off');
          input.setAttribute('autocorrect', 'off');
          input.setAttribute('autocapitalize', 'none');
          input.setAttribute('pattern', '^-?(\\d+|\\d+\\.\\d+|\\.\\d+)?$');

          input.addEventListener('input', function () {
            const next = sanitizeNumericString(this.value);
            if (next !== this.value) {
              this.value = next;
            }

            applyNumericValidation(this);
          });

          input.addEventListener('blur', function () {
            if (this.value === '-') {
              this.value = '';
            }
            applyNumericValidation(this);
          });
        }

        function scanFields() {
          document.querySelectorAll('input').forEach((input) => {
            if (looksLikeNumericField(input)) {
              bindNumericField(input);
            }
          });
        }

        scanFields();
        new MutationObserver(scanFields).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
